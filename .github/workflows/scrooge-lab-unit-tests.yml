name: SCROOGE LAB Safe Unit Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OANDA_API_URL: ""
      OANDA_API_TOKEN: ""
      OANDA_ACCOUNT_ID: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Run repository unit tests without broker credentials
        run: python -m pytest -q -p no:randomly tests
